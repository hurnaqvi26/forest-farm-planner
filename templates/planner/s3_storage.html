{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>S3 Storage</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body class="page-bg">

<header class="top-bar">
    <div class="top-bar-left">
        <div class="logo-circle small">📦</div>
        <span class="top-bar-title">My S3 Storage</span>
    </div>
    <div class="top-bar-right">
        <a href="/dashboard/" class="btn btn-outline">Back</a>
    </div>
</header>

<main class="dashboard-layout">

    <section class="card">
        <h2>Upload Plot Image</h2>

        <form method="POST" enctype="multipart/form-data" class="generate-form">
            {% csrf_token %}

            <div class="form-group">
                <label>Plot ID</label>
                <input type="text" name="plot_id" placeholder="P-01">
            </div>

            <div class="form-group">
                <label>Select Image</label>
                <input type="file" name="image_file">
            </div>

            <button class="btn btn-primary">Upload</button>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
        </form>
    </section>

    <section class="card">
        <h2>Your Uploaded Files</h2>

        <div class="table-wrapper">
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>File</th>
                        <th>Preview</th>
                        <th>URL</th>
                    </tr>
                </thead>
                <tbody>
                    {% for key, url in files %}
                    <tr>
                        <td>{{ key }}</td>
                        <td><img src="{{ url }}" width="100"></td>
                        <td><a href="{{ url }}" target="_blank">Open</a></td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3">No files uploaded</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>

</main>

</body>
</html>
